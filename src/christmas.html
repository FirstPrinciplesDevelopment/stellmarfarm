<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Show | Stellmar Farm</title>

    <link href="./main.css" rel="stylesheet" />
    <script type="module" src="./app.js"></script>
    <script type="module" src="./components/footer/footer.js"></script>
    <script type="module" src="./components/nav/nav.js"></script>
    <script type="module" src="./components/hours/hours.js"></script>
</head>

<body class="text-sf-grey-900">

    <!--Custom Nav Component-->
    <stellmar-nav></stellmar-nav>

    <!--Main Content-->
    <div id="main-content" class="transition-all ease-in-out duration-300 bg-sf-grey-50">
        <div class="absolute top-0 w-full h-1 bg-sf-orange-600"></div>
        <div class="mx-auto container max-w-2xl">
            <div class="flex justify-center p-8">


                <div>
                    <div class="py-8">
                        <h1 class="text-2xl md:text-4xl">Christmas Show</h1>
                        <h2 class="text-xl md:text-2xl">December 6, 7 and 8 2024</h2>
                        <ul class="pt-4 text-sm">

                            <li class="flex justify-between">
                                <div>Friday</div>
                                <div>Noon-4pm</div>
                            </li>
                            <li class="flex justify-between">
                                <div>Saturday</div>
                                <div>10am-4pm</div>
                            </li>
                            <li class="flex justify-between">
                                <div>Sunday</div>
                                <div>10am-3pm</div>
                            </li>
                        </ul>
                    </div>
                    <br><br>

                </div>


            </div>
        </div>
    </div>

    <!--Custom Footer Component-->
    <stellmar-footer></stellmar-footer>
    
</body>

</html>
